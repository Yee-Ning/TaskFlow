name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的版本标签，例如 v1.0.0"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag must match package.json version" }
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - run: npm run smoke:win
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "release/$version/TaskFlow-Windows-$version-Setup.exe"
          $checksum = "release/$version/SHA256SUMS.txt"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath $checksum -Encoding utf8NoBOM
          gh release create $env:RELEASE_TAG $installer $checksum --verify-tag --draft --title "TaskFlow $env:RELEASE_TAG" --notes "Windows x64 安装包。首次使用请注册本地账号；数据保存在本机。未进行代码签名，附 SHA-256 校验文件。"
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
